<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <!-- استدعاء خط Cairo للغة العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* دوائر خلفية جمالية متحركة */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 8s ease-in-out infinite;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -50px;
            right: -50px;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -30px;
            left: -30px;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* حاوية نموذج تسجيل الدخول */
        .login-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        /* حقول الإدخال */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            transition: 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            outline: none;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .input-group input:focus + i {
            color: #fff;
        }

        /* خيارات إضافية (تذكرني + نسيت كلمة المرور) */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
        }

        .options label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .options input[type="checkbox"] {
            margin-left: 6px;
            cursor: pointer;
        }

        .options a {
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
        }

        .options a:hover {
            text-decoration: underline;
        }

        /* زر تسجيل الدخول */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .login-btn:hover {
            background: #f1f1f1;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.15);
        }

        /* رابط إنشاء حساب */
        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .register-link a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- دوائر الخلفية -->
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="login-container">
        <div class="login-header">
            <h2>أهلاً بك مجدداً</h2>
            <p>الرجاء تسجيل الدخول للمتابعة</p>
        </div>

        <form action="#" method="POST">
            <!-- حقل البريد الإلكتروني -->
            <div class="input-group">
                <input type="email" placeholder="البريد الإلكتروني" required>
                <i class="fas fa-envelope"></i>
            </div>

            <!-- حقل كلمة المرور -->
            <div class="input-group">
                <input type="password" placeholder="كلمة المرور" required>
                <i class="fas fa-lock"></i>
            </div>

            <!-- الخيارات (تذكرني / نسيت كلمة المرور) -->
            <div class="options">
                <label>
                    <input type="checkbox"> تذكرني
                </label>
                <a href="#">نسيت كلمة المرور؟</a>
            </div>

            <!-- زر الدخول -->
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>

        <!-- رابط التسجيل -->
        <div class="register-link">
            ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
        </div>
    </div>

</body>
</html>
